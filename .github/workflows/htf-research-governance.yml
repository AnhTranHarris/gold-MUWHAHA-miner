name: HTF ticklab research governance
on:
  push:
    branches:
      - 'carson/htf-governance-anti-drift-v0.1'
  pull_request:
    paths:
      - 'research/htf_dual_ticklab/**'
      - '.github/workflows/htf-research-governance.yml'
permissions:
  contents: read
jobs:
  research-guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Run approved-package regression suite
        working-directory: research/htf_dual_ticklab
        run: python -m pytest -q
      - name: Check example plan (does not execute trades)
        working-directory: research/htf_dual_ticklab
        run: python -m htf_ticklab.research_guard check-plan governance/EXPERIMENT_PLAN_EXAMPLE.json
