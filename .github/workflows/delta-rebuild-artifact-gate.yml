name: DELTA rebuild artifact gate

on:
  push:
    branches: [delta]
    paths:
      - "CURRENT_STATE.json"
      - "research/delta/**"
      - "Experts/GoldMuwahahaMiner_R9_*.mq5"
      - ".github/workflows/delta-rebuild-artifact-gate.yml"
  pull_request:
    branches: [delta]
    paths:
      - "CURRENT_STATE.json"
      - "research/delta/**"
      - "Experts/GoldMuwahahaMiner_R9_*.mq5"
      - ".github/workflows/delta-rebuild-artifact-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delta-rebuild-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile DELTA recovery helpers
        run: python -m py_compile research/delta/qa/delta_bounded_python_runner.py research/delta/qa/DELTA_TIMEOUT_RECOVERY_GUARD.py
      - name: Validate DELTA timeout-recovery cursor
        run: python research/delta/qa/DELTA_TIMEOUT_RECOVERY_GUARD.py
      - name: Enforce DELTA causal/durability contract
        run: python research/delta/qa/DELTA_GOV_001_REBUILD_MANIFEST_GATE.py
      - name: Persist DELTA timeout-recovery snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: delta-recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            CURRENT_STATE.json
            research/delta/CURRENT_INFLIGHT.json
            research/delta/qa/
            research/delta/lab/
            research/delta/experiments/delta_r037_*.py
            research/delta/reference/DELTA_R037_*.json
            research/delta/artifacts/DELTA_R037_*_MANIFEST.json
            research/delta/research/DELTA_R037_*.md
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
