name: DELTA-A-alpha QA

on:
  push:
    branches: [delta-A-alpha]
    paths:
      - "CURRENT_STATE.json"
      - "research/delta_a_alpha/**"
      - ".github/workflows/delta-a-alpha-qa.yml"
  pull_request:
    branches: [delta-A-alpha]
    paths:
      - "CURRENT_STATE.json"
      - "research/delta_a_alpha/**"
      - ".github/workflows/delta-a-alpha-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Delta-A-alpha state modules
        run: |
          python -m py_compile \
            research/delta_a_alpha/experiments/grid_system_state_skeleton.py \
            research/delta_a_alpha/qa/build01_state_skeleton_qa.py
      - name: Run BUILD-01 state skeleton QA
        run: python research/delta_a_alpha/qa/build01_state_skeleton_qa.py
      - name: Validate JSON state pointers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path("CURRENT_STATE.json"),
              Path("research/delta_a_alpha/CURRENT_INFLIGHT.json"),
              Path("research/delta_a_alpha/HELPER_REGISTRY.json"),
              Path("research/delta_a_alpha/state_journal/0021_DAA_GRID_SYSTEM_CLEAN_RESET_003.json"),
          ]:
              json.loads(p.read_text(encoding="utf-8"))
              print("OK", p)
          PY
