name: R9 Micro180 V5 causal research tests
on:
  push:
    branches:
      - carson/r9-micro180-v5-ordered-entry-cash-lifecycle-20261114
  workflow_dispatch:
jobs:
  causal-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original micro180 and V5 contracts (NO market data)
        run: |
          python -m unittest discover -s research/coinexx_r9_chronological/micro180_20261114 -p 'test_micro180.py' -v
          python -m unittest discover -s research/coinexx_r9_chronological/micro180_20261114 -p 'test_asymmetric_v3.py' -v
          python -m unittest discover -s research/coinexx_r9_chronological/micro180_20261114 -p 'test_v5_path_lifecycle.py' -v
          python -m unittest discover -s research/coinexx_r9_chronological/micro180_20261114 -p 'test_v5_ms_path.py' -v
