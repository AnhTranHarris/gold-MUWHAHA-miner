name: DAA033 C2D3F month-blind original S26 S27 mechanism parity
on:
  pull_request:
    paths:
      - 'research/delta_a_alpha/implementation/v1_033_phase_c2d2/**'
      - '.github/workflows/daa-033-c2d3f-source-native-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/delta_a_alpha/implementation/v1_033_phase_c2d2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original Python bridge dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3'
      - name: Compile original funded kernel, source-native adapter and tests
        run: python -m py_compile source_native_s26_s27_033.py test_source_native_s26_s27_033.py test_frozen_jan039_reference_033.py
      - name: Preserve original funded and L1/L2 tests plus original S26 S27 policies
        run: python -m unittest -v test_original_119_multi_parent_033c2c test_funded_084_l7_bridge_033c2d2 test_c2d3_queue_stress_033 test_c2d3b_real_quote_oracle_033 test_c2d3b_funded_causal_ab_033 test_original_131c_source_parity_033 test_completed_htf_roles_033 test_original_131d_identity_smoke_033 test_source_native_s26_s27_033 test_frozen_jan039_reference_033
