name: R9 M60 Coinexx-only quant screening (shadow)

on:
  push:
    paths:
      - 'research/coinexx_r9_chronological/minute60_priority_screen/**'
      - '.github/workflows/r9_m60_priority_screen_ci.yml'
  pull_request:
    paths:
      - 'research/coinexx_r9_chronological/minute60_priority_screen/**'
      - '.github/workflows/r9_m60_priority_screen_ci.yml'

jobs:
  causal-formula-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy numba scikit-learn pandas lightgbm joblib
      - name: Syntax validation
        run: python -m compileall -q research/coinexx_r9_chronological/minute60_priority_screen/src
      - name: Source-only causal indicator tests (no original ticks or credentials in CI)
        env:
          PYTHONPATH: research/coinexx_r9_chronological/minute60_priority_screen/src
          OPENBLAS_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '2'
        run: python -m unittest discover -s research/coinexx_r9_chronological/minute60_priority_screen/tests -v
