name: H1V2 R11 Source Contract Audit
on:
  push:
    branches:
      - carson/h1v2-r11-causal-entry-forensic-remediation-20261102
  workflow_dispatch:
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research test requirements
        run: python -m pip install --disable-pip-version-check numpy pytest numba pandas
      - name: Compile R11 research source
        run: python -m compileall -q research/h1v2_r11_causal_entry_forensic_20261102/src
      - name: Run independent adversarial source contract tests
        env:
          PYTHONPATH: research/h1v2_20261102/src:research/h1v2_r11_causal_entry_forensic_20261102/src
        run: python -m pytest -v research/h1v2_20261102/tests/test_h1v2_teacher.py research/h1v2_r11_causal_entry_forensic_20261102/tests
