name: R9 Coinexx Account Cash Competing Risks
on:
  push:
    paths:
      - 'research/coinexx_r9_chronological/account_cash_competing_risks/**'
      - '.github/workflows/r9_account_cash_competing_risks_ci.yml'
  pull_request:
    paths:
      - 'research/coinexx_r9_chronological/account_cash_competing_risks/**'
      - '.github/workflows/r9_account_cash_competing_risks_ci.yml'
permissions:
  contents: read
jobs:
  python-quote-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source compile only
        run: python -m compileall -q research/coinexx_r9_chronological/account_cash_competing_risks
      - name: R9 original-state-machine and competing-risk synthetic tests
        env:
          PYTHONPATH: research/coinexx_r9_chronological/src:research/coinexx_r9_chronological/account_cash_competing_risks/src
        run: python -m unittest discover -s research/coinexx_r9_chronological/account_cash_competing_risks/tests -v
