name: DELTA-A-alpha BUILD-02 QA

on:
  push:
    branches: [delta-A-alpha]
    paths:
      - "research/delta_a_alpha/experiments/grid_system_session_timeframe.py"
      - "research/delta_a_alpha/qa/build02_session_timeframe_qa.py"
      - "research/delta_a_alpha/grid/DAA_GRID_SYSTEM_BUILD_02_SESSION_TIMEFRAME_AWARENESS_*"
      - ".github/workflows/delta-a-alpha-build02-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build02-session-timeframe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile BUILD-01 and BUILD-02 state modules
        run: |
          python -m py_compile             research/delta_a_alpha/experiments/grid_system_state_skeleton.py             research/delta_a_alpha/experiments/grid_system_session_timeframe.py             research/delta_a_alpha/qa/build02_session_timeframe_qa.py
      - name: Run BUILD-02 session/timeframe QA
        run: python research/delta_a_alpha/qa/build02_session_timeframe_qa.py
