name: R9 V10 causal structure shadow contracts (no market-data downloads)
on:
  push:
    branches:
      - carson/r9-v10-causal-market-structure-shadow-20261115
    paths:
      - 'research/coinexx_r9_chronological/structure_v10/**'
      - 'Experts/GoldMuwahahaR9V10StructureShadow.mqh'
      - 'Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5'
      - '.github/workflows/r9_v10_causal_structure_shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v10-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse V10 modules and test deterministic causal structure
        shell: bash
        run: |
          python -m py_compile research/coinexx_r9_chronological/structure_v10/*.py
          python -m unittest discover -s research/coinexx_r9_chronological/structure_v10 -p 'test_*.py' -v
      - name: Run existing V9 tests with all prior dependencies
        shell: bash
        run: |
          cd research/coinexx_r9_chronological
          PYTHONPATH=src:variable_cash_horizon_20261114:dual_basket_20261114:micro180_20261114 \
            python -m unittest discover -s micro180_20261114 -p 'test_*.py' -v
      - name: Protect source-exact parent and research-only controls
        shell: bash
        run: |
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_HybridGate.mq5)" = "07222b1a3800c9cc826abe10a4ce6afbd97b0af5"
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_Micro180_V8_Research.mq5)" = "0c52da7ea7e22701e607181380a4f49f9aad78eb"
          grep -q 'InpEnableDemoOrders        = false' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          grep -q 'InpV10StructureShadow     = false' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          grep -q 'InpMaxIntendedLossCash     = 2.00' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          grep -q 'InpCapitalFloorPct        = 25.0' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          grep -q 'CopyRates(_Symbol,m_frames\[f\],1,5,q)' Experts/GoldMuwahahaR9V10StructureShadow.mqh
          grep -q 'R9V10StructureShadow' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          ! grep -qE 'OrderSend|PositionClose|CTrade|trade.Buy|trade.Sell' Experts/GoldMuwahahaR9V10StructureShadow.mqh
          ! grep -qE 'DownloadTicks|Downloader|CreateRawTickCache' research/coinexx_r9_chronological/structure_v10/*.py
      - name: Package exact pinned research source (NO market data)
        uses: actions/upload-artifact@v4
        with:
          name: r9-v10-python-source-exact
          retention-days: 1
          if-no-files-found: error
          path: |
            research/coinexx_r9_chronological/src/
            research/coinexx_r9_chronological/micro180_20261114/*.py
            research/coinexx_r9_chronological/dual_basket_20261114/*.py
            research/coinexx_r9_chronological/variable_cash_horizon_20261114/*.py
            research/coinexx_r9_chronological/structure_v10/*.py
      - name: Qualification scope
        run: echo 'Python unit/source contracts only. Native MetaEditor compilation, full-month structure metrics, and broker-side parity NOT certified.'
