name: DAA 033 C2D3E original 131D source-key + funded quote ordinal parity
on:
  pull_request:
    paths:
      - 'research/delta_a_alpha/implementation/v1_033_phase_c2d2/**'
      - '.github/workflows/daa-033-c2d3e-identity-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-ordinal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/delta_a_alpha/implementation/v1_033_phase_c2d2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CI fixture dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3'
      - name: Compile original adapter and exact JAN032 fixture
        run: python -m py_compile original_131d_quote_ordinal_033.py verified_original_sources/jan_session_portfolio_131d.py test_original_131d_identity_smoke_033.py
      - name: Original existing 36 tests plus two source ordinal physical L7 tests
        run: python -m unittest -v test_original_119_multi_parent_033c2c test_funded_084_l7_bridge_033c2d2 test_c2d3_queue_stress_033 test_c2d3b_real_quote_oracle_033 test_c2d3b_funded_causal_ab_033 test_original_131c_source_parity_033 test_completed_htf_roles_033 test_original_131d_identity_smoke_033
