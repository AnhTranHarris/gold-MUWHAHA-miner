name: MICRO180 RB1 causal-entry contracts
on:
  push:
    branches:
      - carson/micro180-rb1-positive-entry-causal-rebuild-20261117
  workflow_dispatch:

jobs:
  entry-only-reconstruction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/micro180_positive_entry_rebuild_20261117
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic causal entry dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile original-tick C++ extractor with warnings fatal
        run: g++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic src/causal_quote_engine.cpp -lz -o src/causal_quote_engine
      - name: Run entry-only as-of contracts
        run: python -m unittest discover -s tests -v
