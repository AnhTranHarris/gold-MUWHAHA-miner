name: DELTA-A-alpha V1 MT5 Unit 006 QA

on:
  push:
    branches: [delta-A-alpha]
    paths:
      - "Experts/GoldMuwahahaMiner_DeltaAAlpha_V1.mq5"
      - "research/delta_a_alpha/mt5/DAA_VERTICAL_GRID_SYSTEM_V1_MT5_PROPOSAL_ARBITER_AND_HEAT_GOVERNOR_006_*"
      - "research/delta_a_alpha/qa/v1_mt5_arbiter_heat_qa.py"
      - ".github/workflows/delta-a-alpha-v1-mt5-unit006-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arbiter-heat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile QA
        run: python -m py_compile research/delta_a_alpha/qa/v1_mt5_arbiter_heat_qa.py
      - name: Run arbiter/heat deterministic QA
        run: python research/delta_a_alpha/qa/v1_mt5_arbiter_heat_qa.py
