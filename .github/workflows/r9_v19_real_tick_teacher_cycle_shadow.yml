name: R9 V19 real-tick teacher cycle, micro180 shadow (no orders)
on:
  push:
    branches:
      - carson/r9-v19-real-ticklogger-micro180-cycle-transfer-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-preserving-cycle-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded regression dependencies without ticks
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - name: Test V19 policy and original strategy research (no market-data download)
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/coinexx_r9_chronological
          export PYTHONPATH="$ROOT/src:$ROOT/variable_cash_horizon_20261114:$ROOT/dual_basket_20261114:$ROOT/micro180_20261114:$ROOT/structure_v10:$ROOT/telemetry_v12:$ROOT/profitfirst_v19"
          python -m py_compile "$ROOT/profitfirst_v19/causal_cycle_policy_v19.py"
          python -m unittest discover -s "$ROOT/profitfirst_v19" -p 'test_*.py' -v
          python -m unittest discover -s "$ROOT/micro180_20261114" -p 'test_*.py' -v
          python -m unittest discover -s "$ROOT/structure_v10" -p 'test_*.py' -v
          python -m unittest discover -s "$ROOT/telemetry_v12" -p 'test_*.py' -v
      - name: Frozen source and no-order contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/coinexx_r9_chronological
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/src/coinexx_r9/r9_baseline.py)" = "a760b843577e53a3fa165273421b0270dba4f35e"
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_HybridGate.mq5)" = "07222b1a3800c9cc826abe10a4ce6afbd97b0af5"
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_Micro180_V8_Research.mq5)" = "0c52da7ea7e22701e607181380a4f49f9aad78eb"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/micro180_20261114/v9_volume_router.py)" = "036c5ae716aae7688bd55703ace415ec56c2e4d6"
          grep -Fq 'InpEnableDemoOrders        = false' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          ! grep -RE 'OrderSend\(|OrderSendAsync\(|PositionClose\(|CTrade|trade\.Buy\(' "$ROOT/profitfirst_v19" --include='*.py'
      - name: Release gate
        run: echo 'Research only; no MetaEditor compile, source archives, broker fill proof, production promotion, or untouched OOS.'
