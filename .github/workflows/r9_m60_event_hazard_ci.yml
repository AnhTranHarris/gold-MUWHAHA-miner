name: R9 M60 event-time competing hazards research tests

on:
  push:
    paths:
      - 'research/coinexx_r9_chronological/minute60_competing_hazards/**'
      - '.github/workflows/r9_m60_event_hazard_ci.yml'
  pull_request:
    paths:
      - 'research/coinexx_r9_chronological/minute60_competing_hazards/**'
      - '.github/workflows/r9_m60_event_hazard_ci.yml'

jobs:
  causal-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numeric research libraries
        run: python -m pip install --disable-pip-version-check numpy pandas numba scikit-learn lightgbm joblib
      - name: Compile research source
        run: python -m compileall -q research/coinexx_r9_chronological/minute60_competing_hazards/src
      - name: Causal, price-side and risk-set tests
        env:
          PYTHONPATH: research/coinexx_r9_chronological/minute60_competing_hazards/src
          OPENBLAS_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '2'
        run: python -m unittest discover -s research/coinexx_r9_chronological/minute60_competing_hazards/tests -v
