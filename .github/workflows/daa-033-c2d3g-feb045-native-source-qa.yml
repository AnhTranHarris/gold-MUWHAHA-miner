name: DAA 033 C2D3G native FEB045 source and completed-quote context parity
on:
  pull_request:
    paths:
      - 'research/delta_a_alpha/implementation/v1_033_phase_c2d2/**'
      - '.github/workflows/daa-033-c2d3g-feb045-native-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feb045-native-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: research/delta_a_alpha/implementation/v1_033_phase_c2d2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original numpy pandas dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3'
      - name: Compile full inherited V1 code and new exact FEB045 source mask
        run: python -m py_compile v1_funded_core_033c.py source_native_s26_s27_033.py feb045_source_native_context_033.py test_feb045_source_native_context_033.py test_feb045_original_source_manifest_033.py audit_feb045_exact_original_masks_033.py audit_feb041_completed_10m_ranges_033.py
      - name: Inherited 45-plus original V1 and new 9 FEB045 source tests
        run: python -m unittest -v test_original_119_multi_parent_033c2c test_funded_084_l7_bridge_033c2d2 test_c2d3_queue_stress_033 test_c2d3b_real_quote_oracle_033 test_c2d3b_funded_causal_ab_033 test_original_131c_source_parity_033 test_completed_htf_roles_033 test_original_131d_identity_smoke_033 test_source_native_s26_s27_033 test_frozen_jan039_reference_033 test_feb045_source_native_context_033 test_feb045_original_source_manifest_033
