name: R9 V12 exact-ms micro180 and DEMO-only telemetry (research)
on:
  push:
    branches:
      - carson/r9-v12-exactms-micro180-telemetry-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-shadow-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded Python research test dependency (NO market data)
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: V12 original quote ordinal, broker telemetry and inherited V9/V10/V11 regressions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/coinexx_r9_chronological
          export PYTHONPATH="$ROOT/src:$ROOT/variable_cash_horizon_20261114:$ROOT/dual_basket_20261114:$ROOT/micro180_20261114:$ROOT/structure_v10:$ROOT/telemetry_v12"
          python -m py_compile "$ROOT/micro180_20261114/micro180_exactms_v12.py" "$ROOT/micro180_20261114/summarize_micro180_v12.py" "$ROOT/telemetry_v12/broker_telemetry_v12.py"
          python -m unittest discover -s "$ROOT/micro180_20261114" -p 'test_*.py' -v
          python -m unittest discover -s "$ROOT/structure_v10" -p 'test_*.py' -v
          python -m unittest discover -s "$ROOT/telemetry_v12" -p 'test_*.py' -v
      - name: Immutable trading baselines and disabled native observer contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_HybridGate.mq5)" = "07222b1a3800c9cc826abe10a4ce6afbd97b0af5"
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_Micro180_V8_Research.mq5)" = "0c52da7ea7e22701e607181380a4f49f9aad78eb"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/micro180_20261114/v9_volume_router.py)" = "036c5ae716aae7688bd55703ace415ec56c2e4d6"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/structure_v10/causal_structure.py)" = "f21a70ad44194d5c09be98a52f1e97793d9eb2c1"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/structure_v10/structure_refinement_v11.py)" = "157e720215b263734fe017edfa12ec52459181fb"
          grep -Fq 'InpEnableDemoOrders        = false' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          grep -Fq 'InpEnableObserver       = false;' Experts/GoldMuwahahaR9V12DemoTelemetryObserver.mq5
          grep -Fq 'ACCOUNT_TRADE_MODE_DEMO' Experts/GoldMuwahahaR9V12DemoTelemetryObserver.mq5
          grep -Fq 'PrefixAt("DEAL"' Experts/GoldMuwahahaR9V12DemoTelemetryObserver.mq5
          ! grep -E 'OrderSend\(|OrderSendAsync\(|PositionClose\(|OrderModify\(|trade\.Buy\(|trade\.Sell\(' Experts/GoldMuwahahaR9V12DemoTelemetryObserver.mq5
      - name: Package exact Python V12 source only (no market data)
        uses: actions/upload-artifact@v4
        with:
          name: v12-exact-source-20261115
          retention-days: 1
          if-no-files-found: error
          path: |
            research/coinexx_r9_chronological/src/
            research/coinexx_r9_chronological/variable_cash_horizon_20261114/*.py
            research/coinexx_r9_chronological/dual_basket_20261114/*.py
            research/coinexx_r9_chronological/micro180_20261114/*.py
            research/coinexx_r9_chronological/structure_v10/*.py
            research/coinexx_r9_chronological/telemetry_v12/*.py
      - name: Scope
        run: echo 'Research-only exact-ms simulation and read-only demo telemetry tests. No MetaEditor compile, broker deal data, live trading, or independent OOS certification.'
