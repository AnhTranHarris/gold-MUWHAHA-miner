name: R9 V16 profit-first original-ordinal research (no market data)
on:
  push:
    branches:
      - carson/r9-v16-profitfirst-winner-lifecycle-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded local test dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - name: V16 causal quote-clock research tests
        shell: bash
        run: |
          set -euo pipefail
          path=research/coinexx_r9_chronological/profitfirst_v16
          python -m py_compile "$path"/*.py
          PYTHONPATH="$path" python -m unittest discover -s "$path" -p 'test_v16*.py' -v
      - name: Inherited R9 V9/V10/V11/V12 research contracts
        shell: bash
        run: |
          set -euo pipefail
          root=research/coinexx_r9_chronological
          export PYTHONPATH="$root/src:$root/variable_cash_horizon_20261114:$root/dual_basket_20261114:$root/micro180_20261114:$root/structure_v10:$root/telemetry_v12"
          python -m unittest discover -s "$root/micro180_20261114" -p 'test_*.py' -v
          python -m unittest discover -s "$root/structure_v10" -p 'test_*.py' -v
          python -m unittest discover -s "$root/telemetry_v12" -p 'test_*.py' -v
      - name: Freeze original trading source; never enable MT5 orders
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_HybridGate.mq5)" = "07222b1a3800c9cc826abe10a4ce6afbd97b0af5"
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_Micro180_V8_Research.mq5)" = "0c52da7ea7e22701e607181380a4f49f9aad78eb"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/micro180_20261114/v9_volume_router.py)" = "036c5ae716aae7688bd55703ace415ec56c2e4d6"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/micro180_20261114/micro180_exactms_v12.py)" = "52ef8d3c2e9485dcb7717a9b25e0a71d67541ac8"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/structure_v10/structure_refinement_v11.py)" = "157e720215b263734fe017edfa12ec52459181fb"
          grep -Fq 'InpEnableDemoOrders        = false' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          grep -Fq 'InpEnableObserver       = false;' Experts/GoldMuwahahaR9V12DemoTelemetryObserver.mq5
          ! grep -RE 'OrderSend\(|OrderSendAsync\(|PositionClose\(' research/coinexx_r9_chronological/profitfirst_v16 --include='*.py'
      - name: Limitations
        run: echo 'Full nine-month data replay performed separately; no native MT5 compile, real broker fill verification, or OOS profitability certification.'
