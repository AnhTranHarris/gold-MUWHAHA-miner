name: R9 V15 prospective lattice causal source contracts
on:
  push:
    branches:
      - carson/r9-v15-prospective-winner-mechanisms-20261115
    paths:
      - 'research/coinexx_r9_chronological/v15/**'
      - '.github/workflows/r9_v15_prospective_lattice_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-prospective-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Python dependencies (no market-data download)
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - name: Compile and test source-ordinal next-quote execution contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/coinexx_r9_chronological
          export PYTHONPATH="$ROOT/v15:$ROOT/cfael_v13:$ROOT/src:$ROOT/micro180_20261114:$ROOT/dual_basket_20261114:$ROOT/variable_cash_horizon_20261114"
          python -m py_compile "$ROOT/v15/prospective_lattice_locked.py" "$ROOT/v15/test_prospective_lattice.py" "$ROOT/v15/positive_entry_conditions.py"
          python -m unittest discover -s "$ROOT/v15" -p 'test_*.py' -v
          python -m unittest discover -s "$ROOT/cfael_v13" -p 'test_*.py' -v
      - name: Strict original code preservation and zero broker orders
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_HybridGate.mq5)" = "07222b1a3800c9cc826abe10a4ce6afbd97b0af5"
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_Micro180_V8_Research.mq5)" = "0c52da7ea7e22701e607181380a4f49f9aad78eb"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/micro180_20261114/v9_volume_router.py)" = "036c5ae716aae7688bd55703ace415ec56c2e4d6"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/structure_v10/causal_structure.py)" = "f21a70ad44194d5c09be98a52f1e97793d9eb2c1"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/structure_v10/structure_refinement_v11.py)" = "157e720215b263734fe017edfa12ec52459181fb"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/micro180_20261114/micro180_exactms_v12.py)" = "52ef8d3c2e9485dcb7717a9b25e0a71d67541ac8"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/cfael_v13/research.py)" = "3cfb45fda8d2529740586e8b8de8f34f354c7a58"
          grep -Fq 'InpEnableDemoOrders        = false' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          ! grep -rE 'OrderSend\(|OrderSendAsync\(|PositionClose\(|MetaTrader5\.order_send' research/coinexx_r9_chronological/v15
      - name: Qualification scope
        run: echo 'Source CI and synthetic unit tests only. Development-month profitability is NOT native MT5 parity, broker fills or independent OOS.'
