name: R9 v2 entry repair tests

on:
  push:
    branches:
      - carson/r9-v2-entry-asymmetry-repair-20261102
  workflow_dispatch:

jobs:
  audit-repair-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install --upgrade pip numpy numba pandas pytest
      - name: Run source-level R9 v2 repair contract
        env:
          PYTHONPATH: research/r9_v2_dual_action_bnph_20261102/src
        run: |
          pytest -q \
            research/r9_v2_dual_action_bnph_20261102/tests/test_entry_repair.py \
            research/r9_v2_dual_action_bnph_20261102/tests/test_250ms_universe.py \
            research/r9_v2_dual_action_bnph_20261102/tests/test_fitted_slot_excitation.py \
            research/r9_v2_dual_action_bnph_20261102/tests/test_repaired_online_offline_parity.py \
            research/r9_v2_dual_action_bnph_20261102/tests/test_audit_repair_contract.py
