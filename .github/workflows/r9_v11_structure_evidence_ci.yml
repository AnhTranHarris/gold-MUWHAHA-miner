name: R9 V11 structural evidence and invalidation (research only)
on:
  push:
    branches:
      - carson/r9-v11-structure-evidence-htf-invalidation-20261115
    paths:
      - 'research/coinexx_r9_chronological/structure_v10/**'
      - '.github/workflows/r9_v11_structure_evidence_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v11-causal-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test V11, V10 and frozen V9 source contracts (no downloads)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/coinexx_r9_chronological/structure_v10/*.py
          python -m unittest discover -s research/coinexx_r9_chronological/structure_v10 -p 'test_*.py' -v
          cd research/coinexx_r9_chronological
          PYTHONPATH=src:variable_cash_horizon_20261114:dual_basket_20261114:micro180_20261114 \
            python -m unittest discover -s micro180_20261114 -p 'test_*.py' -v
      - name: Safety contract and immutable source verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_HybridGate.mq5)" = "07222b1a3800c9cc826abe10a4ce6afbd97b0af5"
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_Micro180_V8_Research.mq5)" = "0c52da7ea7e22701e607181380a4f49f9aad78eb"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/structure_v10/causal_structure.py)" = "f21a70ad44194d5c09be98a52f1e97793d9eb2c1"
          grep -q 'InpEnableDemoOrders        = false' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          grep -q 'InpV10StructureShadow     = false' Experts/GoldMuwahahaMiner_R9_Micro180_V9_Research.mq5
          grep -q 'SHADOW_NO_ORDER_OR_EXIT_EFFECT' research/coinexx_r9_chronological/structure_v10/structure_overlay_v11.py
          ! grep -rE 'download_ticks|ticks\.download|OrderSend|CTrade|PositionClose' research/coinexx_r9_chronological/structure_v10/structure_refinement_v11.py
      - name: Qualification
        run: echo 'No MetaEditor compile or real Coinexx nine-month re-evaluation in this CI.'
