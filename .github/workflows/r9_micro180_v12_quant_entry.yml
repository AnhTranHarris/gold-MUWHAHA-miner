name: Micro180 V12 independent Coinexx multiscale entry (research)

on:
  push:
    branches:
      - carson/micro180-v12-coinexx-quant-entry-20261116
    paths:
      - 'research/coinexx_r9_chronological/micro180_20261114/v12_*.py'
      - 'research/coinexx_r9_chronological/micro180_20261114/run_v12_*.py'
      - 'research/coinexx_r9_chronological/micro180_20261114/test_v12_*.py'
      - '.github/workflows/r9_micro180_v12_quant_entry.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  independent-causal-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile V12 source, reader and independent tests
        run: |
          python -m py_compile \
            research/coinexx_r9_chronological/micro180_20261114/v12_micro180_quant_entry.py \
            research/coinexx_r9_chronological/micro180_20261114/run_v12_quant_merged_entries.py \
            research/coinexx_r9_chronological/micro180_20261114/test_v12_micro180_quant_entry.py
      - name: Test causal factor scoring and dual-basket entries
        run: |
          cd research/coinexx_r9_chronological
          PYTHONPATH=src:variable_cash_horizon_20261114:dual_basket_20261114:micro180_20261114 \
            python -m unittest micro180_20261114/test_v12_micro180_quant_entry.py -v
      - name: Preserve the source-verified existing Micro180 baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD:Experts/GoldMuwahahaMiner_R9_HybridGate.mq5)" = "07222b1a3800c9cc826abe10a4ce6afbd97b0af5"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/src/coinexx_r9/r9_baseline.py)" = "a760b843577e53a3fa165273421b0270dba4f35e"
          test "$(git rev-parse HEAD:research/coinexx_r9_chronological/micro180_20261114/v9_volume_router.py)" = "036c5ae716aae7688bd55703ace415ec56c2e4d6"
          grep -q 'allow_live_orders: bool = False' research/coinexx_r9_chronological/micro180_20261114/v12_micro180_quant_entry.py
      - name: Scope
        run: |
          echo "This tests source code only. It is not a claim of full real tick matched entries."
          echo "Do not merge to native demo/live until entire independent entry concordance is measured."
