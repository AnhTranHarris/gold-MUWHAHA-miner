name: R9 v1.94 frozen P5 cash competing risks
on:
  push:
    paths:
      - 'research/coinexx_r9_chronological/cash5_competing_risks/**'
      - '.github/workflows/r9_v194_cash5_competing_risks_ci.yml'
  pull_request:
    paths:
      - 'research/coinexx_r9_chronological/cash5_competing_risks/**'
      - '.github/workflows/r9_v194_cash5_competing_risks_ci.yml'
permissions:
  contents: read
jobs:
  shadow-only-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scikit-learn>=1.4,<2'
      - name: Compile and unit-test only small causal research code
        run: |
          python -m compileall -q research/coinexx_r9_chronological/cash5_competing_risks
          python -m unittest discover -s research/coinexx_r9_chronological/cash5_competing_risks/tests -v
