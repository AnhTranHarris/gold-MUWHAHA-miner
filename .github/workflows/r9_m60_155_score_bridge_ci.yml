name: R9 M60 155-score bridge unit tests
on:
  push:
    paths:
      - 'research/coinexx_r9_chronological/m60_155_integration/**'
      - 'Experts/GoldMuwahahaR9M60ModelBridge.mqh'
      - 'Experts/GoldMuwahahaMiner_R9_HybridGate.mq5'
      - '.github/workflows/r9_m60_155_score_bridge_ci.yml'
  pull_request:
    paths:
      - 'research/coinexx_r9_chronological/m60_155_integration/**'
      - 'Experts/GoldMuwahahaR9M60ModelBridge.mqh'
      - 'Experts/GoldMuwahahaMiner_R9_HybridGate.mq5'
      - '.github/workflows/r9_m60_155_score_bridge_ci.yml'
permissions:
  contents: read
jobs:
  python-bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install small direct-model dependencies
        run: python -m pip install numpy pandas scipy numba joblib lightgbm scikit-learn
      - name: Compile source (syntax only)
        run: python -m compileall -q research/coinexx_r9_chronological/m60_155_integration
      - name: Run strict feature and packet tests
        run: python -m unittest discover -s research/coinexx_r9_chronological/m60_155_integration/tests -v
