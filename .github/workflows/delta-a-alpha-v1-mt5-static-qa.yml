name: DELTA-A-alpha V1 MT5 static QA

on:
  push:
    branches: [delta-A-alpha]
    paths:
      - "Experts/GoldMuwahahaMiner_DeltaAAlpha_V1.mq5"
      - "research/delta_a_alpha/mt5/**"
      - "research/delta_a_alpha/qa/v1_mt5_architecture_static_qa.py"
      - "research/delta_a_alpha/artifacts/DAA_VERTICAL_GRID_SYSTEM_V1_MANIFEST.json"
      - "CURRENT_STATE.json"
      - ".github/workflows/delta-a-alpha-v1-mt5-static-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile static QA
        run: python -m py_compile research/delta_a_alpha/qa/v1_mt5_architecture_static_qa.py
      - name: Verify V1 MT5 architecture contract
        run: python research/delta_a_alpha/qa/v1_mt5_architecture_static_qa.py
